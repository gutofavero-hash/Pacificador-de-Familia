<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentença Completa do Pacificador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dossiê navegável — sumário lateral fixo e as 18 seções do §9 em sequência, com tabelas e gráficos. Mesma identidade da Declaração Universal (violeta e petróleo = dois lados com o mesmo peso). */
:root{
  --paper:#F4F5F9; --paper-2:#E9EBF3; --card:#FFFFFF; --ink:#1A1D38; --muted:#585D7A; --line:#CDD0E0; --grid:#E1E3EE;
  --side-a:#5A45C8; --side-b:#0B7480; --side-a-soft:#E6E2FB; --side-b-soft:#DDF0F1;
  --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#9A5600; --warn-soft:#FBEBD3; --bad:#B3261E; --bad-soft:#F9DEDC; --neutral-soft:#E6E7EF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11132A; --paper-2:#1A1D3A; --card:#181B36; --ink:#ECEDF7; --muted:#A3A7C4; --line:#33375C; --grid:#262A4A;
  --side-a:#A796FF; --side-b:#4FC4CE; --side-a-soft:#2A2457; --side-b-soft:#123B42;
  --good:#5FD39A; --good-soft:#143826; --warn:#F2B35C; --warn-soft:#3D2A0E; --bad:#FF8A80; --bad-soft:#45191A; --neutral-soft:#262A4A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11132A; --paper-2:#1A1D3A; --card:#181B36; --ink:#ECEDF7; --muted:#A3A7C4; --line:#33375C; --grid:#262A4A;
  --side-a:#A796FF; --side-b:#4FC4CE; --side-a-soft:#2A2457; --side-b-soft:#123B42;
  --good:#5FD39A; --good-soft:#143826; --warn:#F2B35C; --warn-soft:#3D2A0E; --bad:#FF8A80; --bad-soft:#45191A; --neutral-soft:#262A4A; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--side-a)}
:focus-visible{outline:3px solid var(--side-a);outline-offset:3px;border-radius:4px}
.page{max-width:880px;margin:0 auto;padding-block:24px 64px;display:grid;gap:clamp(28px,5vw,44px)}
.eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.demo{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 14px,var(--paper) 14px 28px);border:1.5px solid var(--warn);color:var(--ink);
  border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.82rem;text-align:center}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem}
.meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.title-block{display:grid;gap:12px}
.title-block h1{font-size:clamp(1.9rem,5.5vw,3rem);font-weight:800;letter-spacing:-.01em}
.question{font-size:1.1rem;color:var(--muted);font-style:italic;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.74rem;padding:4px 10px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line)}

.verdict{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.v-main{padding:22px 24px;display:grid;gap:10px;align-content:start}
.v-label{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.05}
.v-main.good{background:var(--good-soft)} .v-main.good .v-label{color:var(--good)}
.v-main.warn{background:var(--warn-soft)} .v-main.warn .v-label{color:var(--warn)}
.v-main.bad{background:var(--bad-soft)} .v-main.bad .v-label{color:var(--bad)}
.v-main.neutral{background:var(--neutral-soft)}
.v-conf{padding:22px 24px;display:grid;gap:10px;align-content:start;border-left:1px solid var(--line)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.meter i{height:10px;border-radius:3px;background:var(--grid)}
.meter i.on{background:var(--ink)}
.meter-l{display:grid;grid-template-columns:repeat(3,1fr);font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.conf-n{font-family:var(--display);font-weight:800;font-size:1.3rem}
.small{font-size:.92rem;color:var(--muted)}

.answer{font-size:clamp(1.15rem,2.6vw,1.35rem);line-height:1.55;border-left:4px solid var(--side-a);padding-left:18px;max-width:64ch}

.sec{display:grid;gap:16px}
.sec h2{font-size:clamp(1.3rem,3.2vw,1.65rem);font-weight:800}
.findings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finding{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start}
.finding h3{font-size:1.12rem}
.finding p{font-size:.98rem}
.seal{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;font-weight:500;padding:3px 9px;border-radius:99px;width:max-content;max-width:100%;border:1px solid transparent}
.seal.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.seal.warn{background:var(--warn-soft);color:var(--warn)}
.seal.bad{background:var(--bad-soft);color:var(--bad)}
.seal.neutral{background:var(--neutral-soft);color:var(--ink)}
.seal.a{background:var(--side-a-soft);color:var(--side-a)}
.seal.b{background:var(--side-b-soft);color:var(--side-b)}

.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px clamp(12px,3vw,24px);display:grid;gap:12px;position:relative}
.chart-card h3{font-size:1.15rem}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:.74rem;line-height:1.45;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.chart-note{font-size:.84rem;color:var(--muted)}
.verify{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:5px;white-space:nowrap}

.results{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.results li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.results .r-ef{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.results strong{font-weight:600}

.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.who div{border-radius:14px;padding:16px;background:var(--paper-2);display:grid;gap:6px;align-content:start}
.who h3{font-size:1.02rem}
.who p{font-size:.93rem}

.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.side{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);display:grid;gap:10px;align-content:start}
.side h3{font-size:1.05rem}
.side dl{margin:0;display:grid;gap:8px}
.side dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.side dt.ok{color:var(--good)} .side dt.ko{color:var(--bad)}
.side dd{margin:0;font-size:.95rem}

.tension{border-radius:18px;padding:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:14px}
.t-poles{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.t-pole{font-family:var(--display);font-weight:700;font-size:1.05rem}
.t-pole.r{text-align:right}
.t-bar{width:clamp(60px,18vw,180px);height:8px;border-radius:99px;background:linear-gradient(90deg,var(--side-a),var(--neutral-soft) 50%,var(--side-b))}
.t-costs{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.92rem;color:var(--muted)}
.t-costs div:last-child{text-align:right}

.home{border-radius:22px;padding:clamp(20px,4vw,32px);background:linear-gradient(135deg,var(--side-a-soft),var(--side-b-soft));display:grid;gap:16px}
.home .q{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,3.6vw,1.9rem);line-height:1.2}
.tool{border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding-top:14px;display:grid;gap:6px}
.tool strong{font-family:var(--display)}

.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:2px solid var(--ink);border-radius:18px;padding:18px 20px}
.btn{font-family:var(--display);font-weight:700;border-radius:99px;padding:12px 20px;background:var(--ink);color:var(--paper);text-decoration:none;white-space:nowrap}
.foot{font-family:var(--mono);font-size:.76rem;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px}

@media (max-width:680px){
  .verdict,.findings,.who,.sides{grid-template-columns:1fr}
  .v-conf{border-left:0;border-top:1px solid var(--line)}
  .next{grid-template-columns:1fr}
  .t-poles{grid-template-columns:1fr;text-align:left}
  .t-pole.r{text-align:left}
  .t-bar{width:100%}
  .t-costs{grid-template-columns:1fr}
  .t-costs div:last-child{text-align:left}
}
/* ---- Sentença Completa: sumário lateral + seções numeradas (a numeração é a do §9 do prompt) ---- */
.page.full{max-width:1180px;grid-template-columns:240px minmax(0,1fr);column-gap:clamp(24px,4vw,56px);align-items:start}
.page.full > .demo,.page.full > .top,.page.full > .title-block{grid-column:1/-1}
.toc{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);display:grid;gap:4px;font-family:var(--mono);font-size:.78rem;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 8px;border-radius:8px;display:grid;grid-template-columns:24px 1fr;gap:4px}
.toc a:hover,.toc a.on{background:var(--paper-2);color:var(--ink)}
.toc .exec{margin-bottom:10px;border:1.5px solid var(--ink);color:var(--ink);grid-template-columns:1fr;text-align:center;font-weight:500}
.content{display:grid;gap:clamp(36px,5vw,56px);min-width:0}
.fsec{display:grid;gap:16px;scroll-margin-top:20px;min-width:0}
.fsec > h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:800;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.fsec > h2 .num{font-family:var(--mono);font-size:.85rem;font-weight:500;color:var(--side-a);border:1.5px solid var(--side-a);border-radius:8px;padding:2px 7px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;min-width:620px;font-size:.92rem}
.tbl th{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.facts .src{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.tag{font-family:var(--mono);font-size:.68rem;font-weight:500;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--paper-2);border:1px solid var(--line);width:max-content}
.tag.fato{color:var(--side-b);border-color:var(--side-b)}
.dispute{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:grid;gap:10px}
.dispute ul{margin:0;padding-left:18px}
.resolve{font-size:.93rem;background:var(--paper-2);border-radius:10px;padding:10px 12px}
.timeline{list-style:none;margin:0;padding:0 0 0 22px;display:grid;gap:16px;border-left:2px solid var(--line)}
.timeline li{position:relative;display:grid;gap:2px}
.timeline li::before{content:"";position:absolute;left:-30px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--muted)}
.timeline li.desenho::before{border-color:var(--side-b)} .timeline li.implementacao::before{border-color:var(--side-a)}
.timeline li.aprovacao::before{border-color:var(--ink)} .timeline li.efeito::before{background:var(--good);border-color:var(--good)}
.timeline li.externo::before{border-style:dashed}
.timeline .d{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.timeline .ev{font-weight:600}
.attrib{border-left:4px solid var(--side-b);padding-left:16px}
.ev-badge{font-family:var(--display);font-weight:800;display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-size:.8rem}
.ev-I{background:var(--good-soft);color:var(--good)} .ev-II{background:var(--good-soft);color:var(--good)}
.ev-III{background:var(--warn-soft);color:var(--warn)} .ev-IV{background:var(--neutral-soft);color:var(--muted)}
.callout{border-radius:14px;padding:16px;background:var(--paper-2);display:grid;gap:6px}
.conflict{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.conflict .cv{display:grid;grid-template-columns:1fr 1fr}
.conflict .cv div{padding:14px 16px}
.conflict .cv div:first-child{background:var(--side-a-soft)} .conflict .cv div:last-child{background:var(--side-b-soft)}
.conflict .cj{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:6px}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prop{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);display:grid;gap:8px;align-content:start}
.prop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.9rem}
.prop dt{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-top:2px}
.prop dd{margin:0}
details.par{border:1px solid var(--line);border-radius:14px;background:var(--card)}
details.par summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
details.par .pb{padding:0 16px 16px;display:grid;gap:8px}
.iso{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.iso li{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--grid)}
.st{font-family:var(--mono);font-size:.72rem;font-weight:500;padding:3px 8px;border-radius:6px;text-align:center}
.st.ok{background:var(--good-soft);color:var(--good)} .st.adj{background:var(--warn-soft);color:var(--warn)} .st.ko{background:var(--bad-soft);color:var(--bad)}
.mobile-toc{display:none}
@media (max-width:900px){
  .page.full{grid-template-columns:1fr}
  .toc{display:none}
  .mobile-toc{display:block;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .mobile-toc summary{padding:12px 16px;cursor:pointer;font-family:var(--display);font-weight:700}
  .mobile-toc nav{display:grid;padding:0 8px 10px;font-family:var(--mono);font-size:.8rem}
  .mobile-toc a{padding:6px 8px;color:var(--ink);text-decoration:none}
  .props{grid-template-columns:1fr}
  .conflict .cv{grid-template-columns:1fr}
  .iso li{grid-template-columns:1fr}
}
</style>
</head>

  var h='';
  if(S.exemplo) h+='<div class="demo" role="note">EXEMPLO FICTÍCIO · município, programa e números inventados para demonstrar o modelo</div>';
  h+='<header class="top"><span class="brand">O Pacificador de Famílias</span><span class="meta"><span>Sentença '+esc(S.id)+'</span><span>'+fmtDate(S.data)+'</span><span>Modo '+esc(S.modo)+'</span><span>Versão completa</span></span></header>';
  h+='<section class="title-block"><span class="eyebrow">Objeto</span><h1>'+esc(S.objeto)+'</h1><p class="question">'+esc(S.pergunta)+'</p></section>';
  var toc='<nav class="toc" aria-label="Sumário">'+(S.documento_executivo?'<a class="exec" href="'+esc(S.documento_executivo)+'">← Resumo executivo</a>':'')+SECS.map(function(s){return '<a href="#s'+s[0]+'"><span>'+s[0]+'</span><span>'+s[1]+'</span></a>'}).join('')+'</nav>';
  var c='<details class="mobile-toc"><summary>Sumário</summary><nav>'+(S.documento_executivo?'<a href="'+esc(S.documento_executivo)+'">← Resumo executivo</a>':'')+SECS.map(function(s){return '<a href="#s'+s[0]+'">'+s[0]+' · '+s[1]+'</a>'}).join('')+'</nav></details>';

  c+=sec('1','<div class="chips">'+(S.esferas||[]).map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+(S.poderes||[]).map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+'<span class="chip">'+esc(S.periodo)+'</span></div><p class="small">'+esc(S.data_corte)+'</p>'+
    '<h3>Quadro de Convocação</h3>'+table([['cadeira','Cadeira'],['status','Status',function(v){return '<span class="tag">'+esc(v)+'</span>'}],['origem','Origem'],['justificativa','Justificativa']],S.convocacao||[]));
  c+=sec('2','<p class="answer">'+verif(S.resposta_curta)+'</p>');
  c+=sec('3','<ul class="facts">'+(S.fatos_estabelecidos||[]).map(function(f){return '<li><span class="tag fato">FATO · confiança '+esc(f.confianca).toLowerCase()+'</span><span>'+verif(f.texto)+'</span><span class="src">Fonte: '+esc(f.fonte)+'</span></li>'}).join('')+'</ul>');
  c+=sec('4',(S.fatos_em_disputa||[]).map(function(d){return '<div class="dispute"><strong>'+esc(d.questao)+'</strong><ul>'+(d.posicoes||[]).map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul><div class="resolve"><strong>O que resolve:</strong> '+verif(d.resolveria)+'</div></div>'}).join(''));
  c+=sec('5',(S.grafico?'<div class="chart-card"><h3>'+esc(S.grafico.titulo)+' <span class="small">('+esc(S.grafico.unidade)+')</span></h3><div class="legend" id="lg"></div><div class="chart" id="ch"></div><p class="chart-note">Fonte: '+esc(S.grafico.fonte)+(S.grafico.nota?' · '+esc(S.grafico.nota):'')+'</p></div>':'')+
    table([['acao','Ação'],['indicador','Indicador'],['efeito','Efeito'],['selo','Selo',function(v){return seal(v)}],['evidencia','Evidência',function(v){return '<span class="tag">'+esc(v)+'</span>'}],['confianca','Confiança']],S.resultados||[]));
  c+=sec('6','<ol class="timeline">'+(S.linha_do_tempo||[]).map(function(e){return '<li class="'+esc(e.tipo)+'"><span class="d">'+esc(e.data)+' · '+esc(e.tipo)+'</span><span class="ev">'+esc(e.evento)+'</span><span class="small">'+esc(e.ator)+'</span></li>'}).join('')+'</ol><p class="attrib">'+verif(S.atribuicao)+'</p>');
  c+=sec('7',table([['dimensao','Dimensão'],['uniao','União'],['estado','Estado'],['municipio','Município'],['obs','Observação']],S.matriz_federativa||[]));
  c+=sec('8',table([['ator','Ator'],['interesse_declarado','Interesse declarado'],['interesse_provavel','Interesse provável'],['ganha_perde','Ganha / perde'],['mecanismo','Mecanismo'],['evidencia','Evidência',function(v){return '<span class="ev-badge ev-'+esc(v)+'">'+esc(v)+'</span>'}],['transparencia','Transparência']],S.forcas||[])+
    '<p class="small">Escala de evidência: I documento público ou decisão definitiva · II investigação corroborada · III indício estrutural · IV hipótese.</p>'+
    ((S.hipoteses||[]).length?'<div class="callout"><span class="eyebrow">Hipóteses a investigar (nível IV)</span>'+S.hipoteses.map(function(x){return '<p>'+esc(x.texto)+' <span class="small">O que confirmaria: '+esc(x.confirmaria)+'</span></p>'}).join('')+'</div>':'')+
    (S.polarizacao?'<div class="callout"><span class="eyebrow">A quem interessa a polarização deste tema</span><p>'+esc(S.polarizacao)+'</p></div>':''));
  c+=sec('9','<div class="sides">'+(S.vertentes||[]).map(function(v){return '<div class="side"><h3>'+esc(v.nome)+'</h3><dl><dt class="ok">Acerta</dt><dd>'+esc(v.acerta)+'</dd><dt class="ko">Erra</dt><dd>'+esc(v.erra)+'</dd></dl></div>'}).join('')+'</div>');
  c+=sec('10',(S.valores||[]).map(function(v){return '<div class="tension"><div class="t-poles"><span class="t-pole">'+esc(v.polo_a)+'</span><span class="t-bar" aria-hidden="true"></span><span class="t-pole r">'+esc(v.polo_b)+'</span></div><div class="t-costs"><div><strong>Custo:</strong> '+esc(v.custo_a)+'</div><div><strong>Custo:</strong> '+esc(v.custo_b)+'</div></div><p class="small">'+esc(v.comentario)+'</p></div>'}).join(''));
  c+=sec('11',(S.conflitos||[]).length?S.conflitos.map(function(k){return '<div class="conflict"><div class="cj" style="border-top:0"><strong>'+esc(k.tema)+'</strong></div><div class="cv"><div>'+esc(k.lado_1)+'</div><div>'+esc(k.lado_2)+'</div></div><div class="cj"><span class="small"><strong>O que decidiria:</strong> '+esc(k.decidiria)+'</span><span><strong>Posição do Juiz:</strong> '+esc(k.posicao_juiz)+'</span></div></div>'}).join(''):'<p class="small">Sem conflitos abertos entre as cadeiras.</p>');
  c+=sec('12','<div class="props">'+(S.propostas||[]).map(function(p){return '<div class="prop"><h3>'+esc(p.titulo)+'</h3><dl><dt>Origem</dt><dd>'+esc(p.origem)+'</dd><dt>Custo</dt><dd>'+verif(p.custo)+'</dd><dt>Como</dt><dd>'+esc(p.implementacao)+'</dd><dt>Métrica</dt><dd>'+esc(p.metrica)+'</dd><dt>Revisar se</dt><dd>'+esc(p.criterio)+'</dd></dl></div>'}).join('')+'</div>');
  var lvl={'Baixa':1,'Média':2,'Alta':3}[S.confianca&&S.confianca.nivel]||0;
  c+=sec('13','<div class="verdict"><div class="v-main '+t+'"><span class="eyebrow">Veredicto</span><span class="v-label">'+esc(S.veredicto.rotulo)+'</span><p class="small" style="color:var(--ink)">'+esc(S.veredicto.explicacao)+'</p></div><div class="v-conf"><span class="eyebrow">Confiança geral</span><span class="conf-n">'+esc(S.confianca.nivel)+'</span><div class="meter" aria-hidden="true"><i class="'+(lvl>=1?'on':'')+'"></i><i class="'+(lvl>=2?'on':'')+'"></i><i class="'+(lvl>=3?'on':'')+'"></i></div><p class="small">'+esc(S.confianca.motivo)+'</p></div></div>');
  c+=sec('14','<ul class="iso">'+(S.isonomia||[]).map(function(i){var cl=/APROV/.test(i.status)?'ok':(/AJUST/.test(i.status)?'adj':'ko');return '<li><span class="st '+cl+'">'+esc(i.status)+'</span><span><strong>'+esc(i.item)+'.</strong> '+esc(i.nota)+'</span></li>'}).join('')+'</ul>'+
    '<p class="small">Precedentes aplicados: '+((S.precedentes||[]).length?S.precedentes.map(esc).join('; '):'nenhum caso análogo no registro.')+'</p>');
  c+=sec('15','<div class="callout"><strong style="font-family:var(--display);font-size:1.15rem">'+esc(S.ferramenta.nome)+'</strong><p>'+esc(S.ferramenta.como_reconhecer)+'</p>'+((S.ferramenta.exemplos||[]).length?'<ul>'+S.ferramenta.exemplos.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>':'')+'</div>');
  c+=sec('16','<div class="home"><p class="q">'+esc(S.pergunta_mesa)+'</p></div>');
  c+=sec('17','<p>'+esc(S.proximo_passo)+'</p>');
  c+=sec('18','<p>'+esc(S.gatilho_revisao)+'</p>');
  c+=sec('P',(S.pareceres||[]).map(function(p){return '<details class="par"><summary><span>'+esc(p.cadeira)+'</span><span class="small">confiança '+esc(p.confianca).toLowerCase()+'</span></summary><div class="pb"><p>'+verif(p.resumo)+'</p><p class="small">Teste do sinal invertido: '+esc(p.sinal_invertido)+'</p></div></details>'}).join(''));
  c+=sec('F',table([['nome','Fonte'],['detalhe','Detalhe'],['consulta','Consulta']],S.fontes||[]));
  c+='<footer class="foot"><span>Esta Sentença avalia atos e resultados. Não indica voto.</span><span>O Pacificador de Famílias · '+esc(S.id)+'</span></footer>';
  document.getElementById('app').className='page full';
  document.getElementById('app').innerHTML=h+toc+'<div class="content">'+c+'</div>';
  var links=[].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})}})},{rootMargin:'0px 0px -70% 0px'});
    [].slice.call(document.querySelectorAll('.fsec')).forEach(function(s){io.observe(s)});}

  /* ---------- Gráfico ---------- */
  function chart(G, host, legendHost){
    if(!host) return;
    var W=640,H=300,m={l:44,r:16,t:22,b:34};
    var xs=[],ys=[];G.series.forEach(function(s){s.pontos.forEach(function(p){xs.push(p[0]);ys.push(p[1])})});
    var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
    var y0=G.y_min!=null?G.y_min:0, y1=G.y_max!=null?G.y_max:Math.ceil(Math.max.apply(null,ys)*1.1);
    function X(v){return m.l+(v-x0)/(x1-x0)*(W-m.l-m.r)} function Y(v){return H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b)}
    var COL={principal:'var(--side-a)',pares:'var(--side-b)',contrafactual:'var(--muted)'};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(G.titulo)+'">';
    var step=(y1-y0)/4;
    for(var i=0;i<=4;i++){var v=y0+step*i;s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-family="var(--mono)" font-size="11" fill="var(--muted)">'+Math.round(v)+'</text>';}
    var span=x1-x0, every=span>12?Math.ceil(span/8):(span>8?2:1);
    for(var yr=x0;yr<=x1;yr++){ if((yr-x0)%every===0||yr===x1) s+='<text x="'+X(yr)+'" y="'+(H-m.b+20)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">'+yr+'</text>'; }
    if(G.marco){var mx=X(G.marco.ano);s+='<line x1="'+mx+'" x2="'+mx+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(mx+6)+'" y="'+(m.t+4)+'" font-family="var(--mono)" font-size="11" fill="var(--ink)">'+esc(G.marco.rotulo)+'</text>';}
    G.series.forEach(function(se){var c=COL[se.papel]||'var(--ink)';var d=se.pontos.map(function(p,k){return (k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)}).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(se.papel==='principal'?2.5:2)+'" stroke-linecap="round" stroke-linejoin="round"'+(se.papel==='contrafactual'?' stroke-dasharray="6 5"':'')+'/>';
      if(se.papel!=='contrafactual'){var last=se.pontos[se.pontos.length-1];
        se.pontos.forEach(function(p){if(p[2]==='a_verificar'){s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="var(--card)" stroke="'+c+'" stroke-width="2"/>';}});
        if(last[2]!=='a_verificar') s+='<circle cx="'+X(last[0])+'" cy="'+Y(last[1])+'" r="4.5" fill="'+c+'" stroke="var(--card)" stroke-width="2"/>';
        s+='<text x="'+(X(last[0])-8)+'" y="'+(Y(last[1])-10)+'" text-anchor="end" font-family="var(--display)" font-weight="700" font-size="13" fill="var(--ink)">'+last[1]+(G.unidade==='%'?'%':'')+(last[2]==='a_verificar'?' *':'')+'</text>';}
    });
    s+='<line id="xh" x1="0" x2="0" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-width="1" opacity="0"/>';
    s+='<rect id="hit" x="'+m.l+'" y="'+m.t+'" width="'+(W-m.l-m.r)+'" height="'+(H-m.t-m.b)+'" fill="transparent"/></svg>';
    host.innerHTML=s+'<div class="tip" hidden></div>';
    if(legendHost) legendHost.innerHTML=G.series.map(function(se){return '<span><i style="border-top-color:'+(COL[se.papel]||'var(--ink)')+';'+(se.papel==='contrafactual'?'border-top-style:dashed':'')+'"></i>'+esc(se.nome)+'</span>'}).join('')+(G.series.some(function(se){return se.pontos.some(function(p){return p[2]==='a_verificar'})})?'<span>* <span class="verify">[A VERIFICAR]</span></span>':'');
    var svgEl=host.querySelector('svg'),hit=host.querySelector('#hit'),xh=host.querySelector('#xh'),tip=host.querySelector('.tip');
    function move(ev){var r=svgEl.getBoundingClientRect();var px=(ev.clientX-r.left)/r.width*W;var yr=Math.round(x0+(px-m.l)/(W-m.l-m.r)*(x1-x0));yr=Math.max(x0,Math.min(x1,yr));
      xh.setAttribute('x1',X(yr));xh.setAttribute('x2',X(yr));xh.setAttribute('opacity','1');
      var rows=G.series.map(function(se){var p=se.pontos.filter(function(q){return q[0]===yr})[0];return p?esc(se.nome)+': <b>'+p[1]+(G.unidade==='%'?'%':' '+esc(G.unidade))+'</b>'+(p[2]==='a_verificar'?' [A VERIFICAR]':''):null}).filter(Boolean);
      tip.innerHTML='<b>'+yr+'</b><br>'+rows.join('<br>');tip.hidden=false;
      var tx=X(yr)/W*r.width, cw=host.clientWidth; tip.style.left=Math.max(90,Math.min(cw-90,tx))+'px';tip.style.top=(m.t/H*r.height+10)+'px';}
    hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
    hit.addEventListener('pointerleave',function(){tip.hidden=true;xh.setAttribute('opacity','0')});
  }
  if(S.grafico) chart(S.grafico, document.getElementById('ch'), document.getElementById('lg'));
})();
</script>

</body>
</html>
