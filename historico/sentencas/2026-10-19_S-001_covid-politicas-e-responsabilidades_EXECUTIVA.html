:root{
  --paper:#F4F5F9; --paper-2:#E9EBF3; --card:#FFFFFF; --ink:#1A1D38; --muted:#585D7A; --line:#CDD0E0; --grid:#E1E3EE;
  --side-a:#5A45C8; --side-b:#0B7480; --side-a-soft:#E6E2FB; --side-b-soft:#DDF0F1;
  --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#9A5600; --warn-soft:#FBEBD3; --bad:#B3261E; --bad-soft:#F9DEDC; --neutral-soft:#E6E7EF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11132A; --paper-2:#1A1D3A; --card:#181B36; --ink:#ECEDF7; --muted:#A3A7C4; --line:#33375C; --grid:#262A4A;
  --side-a:#A796FF; --side-b:#4FC4CE; --side-a-soft:#2A2457; --side-b-soft:#123B42;
  --good:#5FD39A; --good-soft:#143826; --warn:#F2B35C; --warn-soft:#3D2A0E; --bad:#FF8A80; --bad-soft:#45191A; --neutral-soft:#262A4A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11132A; --paper-2:#1A1D3A; --card:#181B36; --ink:#ECEDF7; --muted:#A3A7C4; --line:#33375C; --grid:#262A4A;
  --side-a:#A796FF; --side-b:#4FC4CE; --side-a-soft:#2A2457; --side-b-soft:#123B42;
  --good:#5FD39A; --good-soft:#143826; --warn:#F2B35C; --warn-soft:#3D2A0E; --bad:#FF8A80; --bad-soft:#45191A; --neutral-soft:#262A4A; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--side-a)}
:focus-visible{outline:3px solid var(--side-a);outline-offset:3px;border-radius:4px}
.page{max-width:880px;margin:0 auto;padding-block:24px 64px;display:grid;gap:clamp(28px,5vw,44px)}
.eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.demo{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 14px,var(--paper) 14px 28px);border:1.5px solid var(--warn);color:var(--ink);
  border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.82rem;text-align:center}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem}
.meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.title-block{display:grid;gap:12px}
.title-block h1{font-size:clamp(1.9rem,5.5vw,3rem);font-weight:800;letter-spacing:-.01em}
.question{font-size:1.1rem;color:var(--muted);font-style:italic;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.74rem;padding:4px 10px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line)}

.verdict{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.v-main{padding:22px 24px;display:grid;gap:10px;align-content:start}
.v-label{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.05}
.v-main.good{background:var(--good-soft)} .v-main.good .v-label{color:var(--good)}
.v-main.warn{background:var(--warn-soft)} .v-main.warn .v-label{color:var(--warn)}
.v-main.bad{background:var(--bad-soft)} .v-main.bad .v-label{color:var(--bad)}
.v-main.neutral{background:var(--neutral-soft)}
.v-conf{padding:22px 24px;display:grid;gap:10px;align-content:start;border-left:1px solid var(--line)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.meter i{height:10px;border-radius:3px;background:var(--grid)}
.meter i.on{background:var(--ink)}
.meter-l{display:grid;grid-template-columns:repeat(3,1fr);font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.conf-n{font-family:var(--display);font-weight:800;font-size:1.3rem}
.small{font-size:.92rem;color:var(--muted)}

.answer{font-size:clamp(1.15rem,2.6vw,1.35rem);line-height:1.55;border-left:4px solid var(--side-a);padding-left:18px;max-width:64ch}

.sec{display:grid;gap:16px}
.sec h2{font-size:clamp(1.3rem,3.2vw,1.65rem);font-weight:800}
.findings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finding{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start}
.finding h3{font-size:1.12rem}
.finding p{font-size:.98rem}
.seal{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;font-weight:500;padding:3px 9px;border-radius:99px;width:max-content;max-width:100%;border:1px solid transparent}
.seal.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.seal.warn{background:var(--warn-soft);color:var(--warn)}
.seal.bad{background:var(--bad-soft);color:var(--bad)}
.seal.neutral{background:var(--neutral-soft);color:var(--ink)}
.seal.a{background:var(--side-a-soft);color:var(--side-a)}
.seal.b{background:var(--side-b-soft);color:var(--side-b)}

.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px clamp(12px,3vw,24px);display:grid;gap:12px;position:relative}
.chart-card h3{font-size:1.15rem}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:.74rem;line-height:1.45;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.chart-note{font-size:.84rem;color:var(--muted)}
.verify{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:5px;white-space:nowrap}

.results{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.results li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.results .r-ef{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.results strong{font-weight:600}

.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.who div{border-radius:14px;padding:16px;background:var(--paper-2);display:grid;gap:6px;align-content:start}
.who h3{font-size:1.02rem}
.who p{font-size:.93rem}

.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.side{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);display:grid;gap:10px;align-content:start}
.side h3{font-size:1.05rem}
.side dl{margin:0;display:grid;gap:8px}
.side dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.side dt.ok{color:var(--good)} .side dt.ko{color:var(--bad)}
.side dd{margin:0;font-size:.95rem}

.tension{border-radius:18px;padding:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:14px}
.t-poles{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.t-pole{font-family:var(--display);font-weight:700;font-size:1.05rem}
.t-pole.r{text-align:right}
.t-bar{width:clamp(60px,18vw,180px);height:8px;border-radius:99px;background:linear-gradient(90deg,var(--side-a),var(--neutral-soft) 50%,var(--side-b))}
.t-costs{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.92rem;color:var(--muted)}
.t-costs div:last-child{text-align:right}

.home{border-radius:22px;padding:clamp(20px,4vw,32px);background:linear-gradient(135deg,var(--side-a-soft),var(--side-b-soft));display:grid;gap:16px}
.home .q{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,3.6vw,1.9rem);line-height:1.2}
.tool{border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding-top:14px;display:grid;gap:6px}
.tool strong{font-family:var(--display)}

.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:2px solid var(--ink);border-radius:18px;padding:18px 20px}
.btn{font-family:var(--display);font-weight:700;border-radius:99px;padding:12px 20px;background:var(--ink);color:var(--paper);text-decoration:none;white-space:nowrap}
.foot{font-family:var(--mono);font-size:.76rem;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px}

@media (max-width:680px){
  .verdict,.findings,.who,.sides{grid-template-columns:1fr}
  .v-conf{border-left:0;border-top:1px solid var(--line)}
  .next{grid-template-columns:1fr}
  .t-poles{grid-template-columns:1fr;text-align:left}
  .t-pole.r{text-align:left}
  .t-bar{width:100%}
  .t-costs{grid-template-columns:1fr}
  .t-costs div:last-child{text-align:left}
}
</style>
</head>

  h+='<section class="home"><span class="eyebrow" style="color:var(--ink)">Pergunta para a mesa de jantar</span><p class="q">'+esc(S.pergunta_mesa)+'</p>'+
     '<div class="tool"><span class="eyebrow" style="color:var(--ink)">Ferramenta de pensamento</span><strong>'+esc(S.ferramenta.nome)+'</strong><p>'+esc(S.ferramenta.como_reconhecer)+'</p></div></section>';
  h+='<section class="next"><div><span class="eyebrow">O próximo passo</span><p>'+esc(S.proximo_passo)+'</p></div>'+(S.documento_completo?'<a class="btn" href="'+esc(S.documento_completo)+'">Ler a Sentença completa</a>':'')+'</section>';
  h+='<footer class="foot"><span>Gatilho de revisão: '+esc(S.gatilho_revisao)+'</span><span>'+esc(S.data_corte)+' · '+(S.fontes||[]).length+' fontes primárias na versão completa</span><span>Esta Sentença avalia atos e resultados. Não indica voto.</span></footer>';
  document.getElementById('app').innerHTML=h;

  /* ---------- Gráfico ---------- */
  function chart(G, host, legendHost){
    if(!host) return;
    var W=640,H=300,m={l:44,r:16,t:22,b:34};
    var xs=[],ys=[];G.series.forEach(function(s){s.pontos.forEach(function(p){xs.push(p[0]);ys.push(p[1])})});
    var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
    var y0=G.y_min!=null?G.y_min:0, y1=G.y_max!=null?G.y_max:Math.ceil(Math.max.apply(null,ys)*1.1);
    function X(v){return m.l+(v-x0)/(x1-x0)*(W-m.l-m.r)} function Y(v){return H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b)}
    var COL={principal:'var(--side-a)',pares:'var(--side-b)',contrafactual:'var(--muted)'};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(G.titulo)+'">';
    var step=(y1-y0)/4;
    for(var i=0;i<=4;i++){var v=y0+step*i;s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-family="var(--mono)" font-size="11" fill="var(--muted)">'+Math.round(v)+'</text>';}
    var span=x1-x0, every=span>12?Math.ceil(span/8):(span>8?2:1);
    for(var yr=x0;yr<=x1;yr++){ if((yr-x0)%every===0||yr===x1) s+='<text x="'+X(yr)+'" y="'+(H-m.b+20)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">'+yr+'</text>'; }
    if(G.marco){var mx=X(G.marco.ano);s+='<line x1="'+mx+'" x2="'+mx+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(mx+6)+'" y="'+(m.t+4)+'" font-family="var(--mono)" font-size="11" fill="var(--ink)">'+esc(G.marco.rotulo)+'</text>';}
    G.series.forEach(function(se){var c=COL[se.papel]||'var(--ink)';var d=se.pontos.map(function(p,k){return (k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)}).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(se.papel==='principal'?2.5:2)+'" stroke-linecap="round" stroke-linejoin="round"'+(se.papel==='contrafactual'?' stroke-dasharray="6 5"':'')+'/>';
      if(se.papel!=='contrafactual'){var last=se.pontos[se.pontos.length-1];
        se.pontos.forEach(function(p){if(p[2]==='a_verificar'){s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="var(--card)" stroke="'+c+'" stroke-width="2"/>';}});
        if(last[2]!=='a_verificar') s+='<circle cx="'+X(last[0])+'" cy="'+Y(last[1])+'" r="4.5" fill="'+c+'" stroke="var(--card)" stroke-width="2"/>';
        s+='<text x="'+(X(last[0])-8)+'" y="'+(Y(last[1])-10)+'" text-anchor="end" font-family="var(--display)" font-weight="700" font-size="13" fill="var(--ink)">'+last[1]+(G.unidade==='%'?'%':'')+(last[2]==='a_verificar'?' *':'')+'</text>';}
    });
    s+='<line id="xh" x1="0" x2="0" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-width="1" opacity="0"/>';
    s+='<rect id="hit" x="'+m.l+'" y="'+m.t+'" width="'+(W-m.l-m.r)+'" height="'+(H-m.t-m.b)+'" fill="transparent"/></svg>';
    host.innerHTML=s+'<div class="tip" hidden></div>';
    if(legendHost) legendHost.innerHTML=G.series.map(function(se){return '<span><i style="border-top-color:'+(COL[se.papel]||'var(--ink)')+';'+(se.papel==='contrafactual'?'border-top-style:dashed':'')+'"></i>'+esc(se.nome)+'</span>'}).join('')+(G.series.some(function(se){return se.pontos.some(function(p){return p[2]==='a_verificar'})})?'<span>* <span class="verify">[A VERIFICAR]</span></span>':'');
    var svgEl=host.querySelector('svg'),hit=host.querySelector('#hit'),xh=host.querySelector('#xh'),tip=host.querySelector('.tip');
    function move(ev){var r=svgEl.getBoundingClientRect();var px=(ev.clientX-r.left)/r.width*W;var yr=Math.round(x0+(px-m.l)/(W-m.l-m.r)*(x1-x0));yr=Math.max(x0,Math.min(x1,yr));
      xh.setAttribute('x1',X(yr));xh.setAttribute('x2',X(yr));xh.setAttribute('opacity','1');
      var rows=G.series.map(function(se){var p=se.pontos.filter(function(q){return q[0]===yr})[0];return p?esc(se.nome)+': <b>'+p[1]+(G.unidade==='%'?'%':' '+esc(G.unidade))+'</b>'+(p[2]==='a_verificar'?' [A VERIFICAR]':''):null}).filter(Boolean);
      tip.innerHTML='<b>'+yr+'</b><br>'+rows.join('<br>');tip.hidden=false;
      var tx=X(yr)/W*r.width, cw=host.clientWidth; tip.style.left=Math.max(90,Math.min(cw-90,tx))+'px';tip.style.top=(m.t/H*r.height+10)+'px';}
    hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
    hit.addEventListener('pointerleave',function(){tip.hidden=true;xh.setAttribute('opacity','0')});
  }
  if(S.grafico) chart(S.grafico, document.getElementById('ch'), document.getElementById('lg'));
})();
</script>
